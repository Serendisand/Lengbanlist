name: 🛡️ 构建与测试

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Sync child pom versions from root pom
      run: echo "项目版本：$(bash .github/scripts/sync-pom-versions.sh)"

    - name: Build & test with Maven
      run: mvn clean verify -B
