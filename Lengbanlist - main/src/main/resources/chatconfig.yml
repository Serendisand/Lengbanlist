# 违禁词列表（请自行添加哦~）
# 注意：默认不配置任何违禁词，避免误杀正常聊天。
# 词条是大小写敏感的简单子串匹配（不含 * 通配符），请填写完整的词语。
# 添加示例：
#   bad-words:
#     - "开挂"
#     - "外挂"
#     - "刷屏"
bad-words: []

# 禁言阈值（触发多少次后处罚）
# 触发 3 次禁言 1 小时，4 次 12 小时，5 次 1 天，之后每次 7 天
mute-threshold: 3

# 禁言期间禁止执行的命令（可带或不带 /，填写根命令）
# 修改后使用 /lban reload 即可生效
mute-blocked-commands:
  - "/msg"
  - "/tell"
  - "/w"
  - "/r"
  - "/reply"
  - "/me"
  - "/mail"
  - "/tpa"

# 是否剥离命名空间（/minecraft:me 匹配 me；false 时需精确匹配 /minecraft:me）
mute-command-block-strip-namespace: true

