# ============================================================
# Lengbanlist 全局默认文本（所有模型的基准版本 + 自定义模型模板）
# ============================================================
# 【加载顺序】全局默认(_base.yml) → 模型文件覆写
#   模型文件只需要写自己想改的字段，没写的自动沿用这里的文本。
#   插件升级新增字段时，没覆写该字段的模型自动生效，无需逐个改动。
#
# 【改这里】改完执行 /lban reload，所有"没有覆写该字段"的模型立即生效。
#   插件升级会保留你的改动，新增字段仍然来自插件内置的基准版本。
#
# 【自己写模型】照抄本文件 → 放到 plugins/Lengbanlist/models/ 下重命名
#   （文件名以 _ 开头的不会被当作模型加载，如本文件）→ 只保留要改的字段即可。
#
# 【help-overrides】只改帮助菜单里的某几行，两种写法：
#   "lban freeze": "> 把人定住～"            → 只换描述文字，命令部分沿用全局默认（推荐，最短）
#   "lban freeze": "§e✦ §b/lban freeze ..."  → 整行替换（想改前面的符号/颜色时用）
#   "#title" / "#version" 等 # 开头的键       → 整行替换帮助框的标题行与页脚行
#
# 【help-bullet】模型自己的命令行符号，默认 §2✦。设了它，命令行就都能用 "> 描述" 短写法：
#   help-bullet: "§e✦"   →  帮助里所有命令行变成 "§e✦ §b/lban xxx ..."（描述仍按模型覆写）
#
# 【可用占位符】
#   {player}    - 玩家名
#   {reason}    - 处罚原因
#   {days}      - 天数（永久封禁自动显示为"永久"；可用 days-forever/days-suffix 覆盖格式）
#   {ip}        - IP 地址
#   {count}     - 数量（如警告次数、记录条数）
#   {enabled}   - 自动替换为"开启"或"关闭"（可用 enabled-on/enabled-off 覆盖词）
#   {state}     - 同 {enabled}，用于隐身等开关类消息
#   {type}      - 处罚类型（如"封禁"、"禁言"）
#   {target}    - 目标名称
#   {remaining} - 剩余时间
#   {duration}  - 处罚时长
#   {detail}    - 详细信息
#   {entry}     - 历史记录条目
#   {version}   - 插件版本号（可用于 help 帮助菜单）
#   {actor}     - 操作人（回滚）
#   {time}      - 时间范围（回滚）
#   {matched}   - 匹配条数（回滚）
#   {executed}  - 成功执行条数（回滚）
#   {skipped}   - 跳过条数（回滚）
#
# 颜色代码：§0-§f 颜色、§l 加粗、§n 下划线、§o 斜体、§k 乱码、§r 重置
# ============================================================

enabled-on: "开启"
enabled-off: "关闭"
days-forever: "永久"
days-suffix: " 天"

