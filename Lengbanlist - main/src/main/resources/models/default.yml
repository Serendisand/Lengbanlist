# ============================================================
# Default 模型（中文默认风格）
# ============================================================
# 只写和全局默认（models/_base.yml）不一样的部分：
#   - 没写在这里的文本，全部沿用 models/_base.yml
#   - 插件升级新增文案时，本文件不用改也会自动生效
#   - 想改说法，直接改 models/_base.yml（对所有模型生效）
#     ，或者把要改的字段抄到下面按模型覆盖
#
# help-overrides 支持两种键：
#   "#top" / "#title" / "#split" / "#bottom" / "#version" → 帮助框的边框与标题行
#   "lban add"、"lban freeze" 这类命令名                      → 覆写对应命令的那一行
#   值的写法：以 "> " 开头表示只替换描述文字（命令部分沿用全局默认），否则整行替换
#   另有 help-bullet 可指定模型自己的命令行符号（默认 §2✦），设了它就能全程用短写法
#   （命令名匹配用的是"行内命令部分"，越短越容易命中第一行；撞车时写长一点即可）
# ============================================================
name: "Default"

help-overrides:
  "#title": "§b║ §2§oLengbanlist 帮助 - 默认风格 §b║"
  "#version": "§2♡ 当前版本: {version} §7| §b模型: 默认 Default"
