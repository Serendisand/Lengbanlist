# 4. Deleting the plugins/Lengbanlist folder clears local data. Data that has been backed up or retained by third parties is beyond the developer's control.

# 5. 本插件不会主动收集玩家个人隐私信息，但服务器管理员应自行告知玩家相关数据使用情况。
