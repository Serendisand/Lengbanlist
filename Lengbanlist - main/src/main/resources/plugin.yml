name: Lengbanlist
main: org.leng.Lengbanlist
version: ${project.version}
api-version: 1.17
folia-supported: true
softdepend:
  - PlaceholderAPI
  - LuckPerms
authors: 
  - Serendisand
description: >
  This plugin provides a lightweight ban and query system for high-version Minecraft servers.
commands:
  # 其余命令（ban/unban/warn/mute/freeze 等）由 CommandRegistry 按 config.yml 的 features.* 运行时注册，
  # 这里不声明：声明了服务端会在插件加载阶段就把名字占掉，功能关掉也腾不出来给别的插件用。
  lban:
    description: 主命令
    usage: /<command> <必填>子命令
permissions:
  lengbanlist.ban:
    description: 允许使用封禁玩家命令
    default: op
  lengbanlist.banip:
    description: 允许使用封禁 IP 命令
    default: op
  lengbanlist.unban:
    description: 允许使用解封玩家命令
    default: op
  lengbanlist.warn:
    description: 允许使用警告玩家命令
    default: op
  lengbanlist.unwarn:
    description: 允许使用移除警告命令
    default: op
  lengbanlist.check:
    description: 允许使用检查封禁状态命令
    default: op
  lengbanlist.report:
    description: 允许使用举报玩家命令
    default: true
  lengbanlist.admin:
    description: 允许使用管理举报命令
    default: op
  lengbanlist.info:
    description: 允许使用显示插件信息命令
    default: op
  lengbanlist.kick:
    description: 允许使用踢出玩家命令
    default: op
  lengbanlist.allowmsg:
    description: 允许使用允许玩家发送消息命令
    default: op
  lengbanlist.warnmsg:
    description: 允许使用警告玩家发送违规消息命令
    default: op
  lengbanlist.setban:
    description: 允许使用设置封禁时间命令
    default: op
  lengbanlist.history:
    description: 允许使用查询处罚历史命令
    default: op
  lengbanlist.getip:
    description: 允许使用查询玩家 IP 地理位置命令
    default: op
  lengbanlist.staffchat:
    description: 允许使用工作频道聊天命令
    default: op
  lengbanlist.audit:
    description: 允许查看审计日志
    default: op
  lengbanlist.alts:
    description: 允许查询同IP小号
    default: op
  lengbanlist.export:
    description: 允许导出与校验审计日志
    default: op
  lengbanlist.sync:
    description: 允许查看跨服同步状态
    default: op
  lengbanlist.mute:
    description: 允许使用禁言玩家命令
    default: op
  lengbanlist.listmute:
    description: 允许使用查看禁言列表命令
    default: op
  lengbanlist.open:
    description: 允许打开可视化操作界面
    default: op
  lengbanlist.model:
    description: 允许切换插件角色模型
    default: op
  lengbanlist.reload:
    description: 允许重载插件配置
    default: op
  lengbanlist.toggle:
    description: 允许开关全局广播
    default: op
  lengbanlist.list:
    description: 允许查看封禁/处罚列表
    default: op
  lengbanlist.help:
    description: 允许查看命令帮助
    default: op
  lengbanlist.broadcast:
    description: 允许发送插件广播
    default: op
  lengbanlist.rollback:
    description: 允许回滚指定管理员的操作
    default: op
  lengbanlist.vanish:
    description: 允许切换自身隐身状态
    default: op
  lengbanlist.vanish.see:
    description: 允许看见处于隐身状态的管理员
    default: op
  lengbanlist.freeze:
    description: 允许冻结/解冻玩家
    default: op