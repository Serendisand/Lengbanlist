# ---------- 广播设置 ----------
opensendtime: true   # 是否开启封禁人数循环广播
sendtime: 5          # 循环广播间隔（分钟）

# 广播消息列表
# 可用占位符（发送时自动替换）：
#   %s  封禁ID数
#   %i  封禁IP数
#   %t  封禁总数
# 服务器内没有玩家的时候将跳过发送
messages:
  - "当前防火墙系统已累计拦截 %t 次违规接入（含 %s 个玩家ID、%i 个IP地址），请各位玩家遵守服务器规则。"
  - "安全记录更新：已封禁 %s 个违规ID、%i 个异常IP，共计 %t 条防护策略生效中。"
  - "服务器防护状态：%t 条防火墙规则已激活（ID封禁 %s 条，IP封禁 %i 条），感谢您的配合与理解。"
  - "系统公告：当前生效的封禁策略共计 %t 条（涉及 %s 个玩家账户、%i 个网络地址），请勿尝试违规操作。"
  - "防火墙运行报告：已处理 %t 个违规条目（玩家ID %s 个，IP地址 %i 个），维护公平游戏环境需共同努力。"

# 默认消息：仅当上方 messages 列表为空时使用
default-message: "当前防火墙已启用 %t 条封禁策略（含 %s 个ID、%i 个IP），请遵守服务器管理规定。"