# ============================================================
# Lengbanlist 存储配置
# ============================================================

# 本服标识：多子服共用一份数据库时用来区分数据来源。
# 留空或注释掉则记为空标签。建议起短名，例如 survival / skyblock / lobby
server-name: "default"

# ---------- 跨服同步 ----------
# 仅共享数据库（MySQL / MariaDB / PostgreSQL）生效，单机 SQLite 可整段忽略。
sync:
  # 是否启用事件轮询。关闭后退回旧行为：只靠全量刷新。
  event-poll: true
  # 事件拉取间隔（秒，1~60）。调小=>跨服生效更快、数据库查询更频繁。
  poll-seconds: 1
  # 全量兜底刷新开关与间隔（秒，最小 10）。
  auto-sync: true
  interval-seconds: 60
  # 事件表保留时长（分钟）。超时事件由维护任务清理；轮询游标落后于清理范围时由兜底刷新追上，可放心调小。
  event-retention-minutes: 60

# ---------- 数据库 ----------
# 类型: sqlite / mysql / mariadb / postgresql
# 除 sqlite 外都是共享数据库，可多服共用一份数据做跨服同步。
database:
  type: "sqlite"
  sqlite:
    file: "lengbanlist.db"
    # 可选 FULL（每次提交都 fsync，最严格）/ NORMAL（推荐）/ OFF（不落盘，仅调试用）。
    synchronous: "NORMAL"
    # 定期回收已删除数据占用的文件空间。SQLite 删行不会自动缩小文件，
    # 长跑服务器的 .db 会一直停在历史峰值；开启后由维护任务增量回收。
    # 老库首次回收需要重建一次文件（VACUUM），只在真正存在碎片时触发。
    auto-vacuum: true
  retention:
    # IP 历史（player_ip_history）保留天数，0 = 永久保留（默认，与旧版本一致）。
    # 玩家数多、换 IP 频繁的服务器可以设为 180 左右来控制体积。
    ip-history-days: 0
    # 处罚历史（封禁/禁言/警告等）保留天数，过期记录由维护任务清理。
    history-days: 7
  # 身份层回填。插件会在玩家进服时记录「UUID ↔ 名字」并累积曾用名，
  # 这里负责把历史上已经存在的处罚/记录里的玩家名补上对应的 UUID，供改名归并查询使用。
  identity-backfill: true
  # 封禁快照缓存。封禁查询分散在登录拦截、PlaceholderAPI 占位符、Web 面板等处，
  # 单机服务器可适当调大，多服共享库建议不超过 sync.interval-seconds。
  cache:
    ban-ttl-seconds: 5
    # 警告缓存 TTL，留空/注释则跟随 ban-ttl-seconds
    warn-ttl-seconds: 5
  mysql:
    host: "localhost"
    port: 3306
    database: "lengbanlist"
    username: "root"
    password: ""
    # 连接池最大连接数（默认 10，上限 200）。
    # 调大前先确认 MySQL 的 max_connections 余量：这里的连接是常驻的，
    pool-size: 10
  mariadb:
    host: "localhost"
    port: 3306
    database: "lengbanlist"
    username: "root"
    password: ""
    pool-size: 10
  postgresql:
    host: "localhost"
    port: 5432
    database: "lengbanlist"
    username: "postgres"
    password: ""
    pool-size: 10
