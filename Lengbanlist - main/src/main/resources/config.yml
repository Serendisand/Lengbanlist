# 插件前缀
prefix: "§f§l[§x§0§8§4§c§f§bL§x§1§9§5§d§f§be§x§2§9§6§d§f§bn§x§3§a§7§e§f§cg§x§4§a§8§f§f§cb§x§5§b§a§0§f§ca§x§6§b§b§0§f§cn§x§7§c§c§1§f§cl§x§8§c§d§2§f§di§x§9§d§e§2§f§ds§x§a§d§f§3§f§dt§f§l]"

# ---------- 广播设置 ----------
opensendtime: true   # 是否开启封禁人数循环广播
sendtime: 5          # 循环广播间隔（分钟）

# ---------- 角色模型 ----------
Model: "Default"     # 当前模型（说话语气/风格），开启 model-auto-detect 时首次加载会自动设置
model-auto-detect: true  # 首次加载时根据系统语言自动选择模型（zh→Default 中文，其他→English）

# ---------- 功能开关（每个功能可独立开启/关闭，按功能分类） ----------
# 关闭后：独立命令（/ban、/report 等）直接不注册，名字可以留给其他插件；
#         /lban 的子命令（/lban freeze、/lban vanish 等）无法单独注销，执行时会提示"已被管理员禁用"。
features:
  # --- 封禁与处罚 ---
  ban: true            # 封禁玩家（/lban ban）
  ban-ip: true         # 封禁 IP（/lban banip）
  unban: true          # 解封（/lban unban）
  warn: true           # 警告玩家（/lban warn）
  unwarn: true         # 撤销警告（/lban unwarn）
  kick: true           # 踢出玩家（/lban kick）
  mute: true           # 禁言/解禁（/lban mute）
  setban: true         # 自定义封禁（/lban setban）
  vanish: true         # 管理员隐身（/lban vanish，对无 lengbanlist.vanish.see 权限者完全不可见）
  freeze: true         # 冻结玩家（/lban freeze、/lban unfreeze）

  # --- 查询与信息 ---
  check: true          # 查询玩家封禁/警告信息（/lban check）
  history: true        # 封禁历史记录（/lban history）
  info: true           # 插件信息（/lban info）
  getip: true          # 查询玩家 IP 信息（/lban getip）

  # --- 举报与管理员 ---
  report: true         # 玩家举报（/lban report）
  admin: true          # 举报管理界面（/lban admin）
  appeal: true         # 封禁申诉（网页申诉 + 面板处理）

  # --- 玩家体验 ---
  model: true          # 角色模型切换（/lban model）
  tp: true             # 传送（/lban tp）
  chest-ui: true       # 箱子 GUI 管理界面（/lban chest）
  # --- 广播 ---
  broadcast: true        # 广播封禁人数（/lban a、Web 面板触发）
  staffchat: true      # 管理专用聊天（/lban sc）

  # --- 聊天与过滤 ---
  chat-filter: true    # 违禁词过滤、自动禁言、可疑消息标记
  mute-command-block: true  # 禁言期间屏蔽 chatconfig.yml 中指定的指令

  # --- 安全防护 ---
  ip-association: true # 多账号 IP 关联检测
  vpn-detection: true  # VPN/代理检测（登录时，配合 vpn-detection 配置段）
  alts: true           # 小号检测（/lban alts，配合 alts 配置段）

  # --- 处罚体系（免疫/升级/提醒） ---
  immunity: true       # 权重系统（按权重免疫封禁/踢出，配合 immunity 配置段）
  escalation: true     # 封禁时长自动升级（惯犯加重处罚，配合 escalation 配置段）
  expiry-reminder: true  # 封禁到期提醒（配合 expiry-reminder 配置段）
  offline-warn: true   # 离线警告（玩家上线时通知，配合 offline-warn 配置段）

  # --- 审计与数据 ---
  audit: true          # 审计日志（记录封禁/解封/禁言/警告/踢出/举报等管理操作）
  audit-chain: true    # 审计哈希链防篡改（配合 /lban audit export|verify）
  export: true         # 审计日志导出（/lban audit export）
  sync: true          # 数据同步（多服务器）
  rollback: true      # 管理员操作回滚（/lban rollback，基于审计日志）

  # --- 更新 ---
  auto-update: false   # 自动下载并安装新版本（需要重启服务器生效）

  # --- Web / 面板 ---
  webhook-events: true # Webhook 事件推送（配合 webhook 配置段）
  reload: true         # 允许 Web 面板重载配置

# ---------- 统一下载 / 镜像源 ----------
# 所有对外下载（插件更新检查、云端模型、后续的扩展市场）共用这里的连接参数。
# 镜像链按用途分开配置；某个用途留空即使用内置默认链。
download:
  connect-timeout: 8000  # 连接超时（毫秒），国内网络建议不低于 5000
  read-timeout: 10000    # 读取超时（毫秒）
  user-agent: "Lengbanlist"  # 请求 User-Agent
  ssl-verify: true       # 是否校验 SSL 证书；仅当服务器网络存在证书劫持导致 PKIX 报错时才设为 false（有安全风险，不推荐）
  mirrors:
    # 插件更新检查（按顺序尝试，第一个成功即停止；加速站可能批量失效，失效时请自行更换）
    # type 支持：github（直连）/ github-proxy（加速代理）/ jsdelivr（CDN，较稳定）/ gitee（需先在 gitee 建镜像仓库）
    update:
      - name: gh-proxy
        type: github-proxy
        url: "https://gh-proxy.com/https://api.github.com/repos/Serendisand/Lengbanlist/releases/latest"
      - name: jsDelivr
        type: jsdelivr
        url: "https://data.jsdelivr.com/v1/packages/gh/Serendisand/Lengbanlist"
      - name: GitHub直连
        type: github
        url: "https://api.github.com/repos/Serendisand/Lengbanlist/releases/latest"
    # 云端模型索引；留空使用内置默认链（raw.githubusercontent -> gh-proxy -> mirror.ghproxy）
    models: []

# ---------- 更新检查 ----------
update-check:
  enabled: true          # 是否开启更新检查（连接参数与镜像见上面的 download 段）

# ---------- 冻结（freeze） ----------
# 被冻结的玩家无法移动/破坏/放置/交互/丢弃物品/使用命令/传送，只能由管理员手动解冻。
# 冻结状态存于数据库（与封禁/禁言同一份），重启不丢，共享数据库时跨子服生效。
freeze:
  block-commands: true     # 冻结期间禁止被冻结玩家执行命令（防止 /spawn /home 一类传送逃脱）
  allowed-commands: []     # block-commands 为 true 时仍然放行的命令（不带斜杠）
                           # 装了登录插件请填: [login, register, l, msg, r]

# ---------- 预设封禁/警告原因（命令快捷选择） ----------
preset-reasons:
  normal: "违规建筑/破坏服务器"
  cheat: "使用外挂/作弊"
  abuse: "言语辱骂/人身攻击"
  spam: "广告/刷屏"
  grief: "恶意破坏"

# ---------- 数据保留 / 数据库 ----------
# 数据库、保留天数、封禁缓存、服务器标识等存储相关配置已拆分到 storage.yml
# （旧版本写在 config.yml 里的 database 段会在首次启动时自动迁移过去）

# ---------- 举报 ----------
report-cooldown-seconds: 86400  # 玩家举报冷却时间（秒）

# ---------- 封禁申诉 ----------
# 被封禁的玩家打不开游戏，所以申诉走网页：http://<面板地址>/appeal
# 出于安全考虑，公开申诉页默认关闭（公开页面意味着面板端口要对玩家可见），
# 建议仅在内网或反向代理 + HTTPS 后开启，并把 public-url 填成对玩家可见的地址。
appeal:
  enabled: true                 # 总开关（features.appeal 也要为 true）
  public-enabled: false         # 是否开放网页申诉页与公开接口
  public-url: ""                # 对玩家可见的申诉地址，填了会附在封禁踢出提示里，例如 https://mc.example.com/appeal
  require-contact: false        # 是否必填联系方式
  min-reason-length: 10         # 申诉理由最少字数
  cooldown-seconds: 600         # 同一玩家两次申诉的最小间隔（秒）
  max-pending: 3                # 同一玩家最多允许几条未处理申诉
  ticket-ttl-minutes: 30        # 查询凭证有效期（分钟），过期需重新查询

# ---------- Webhook 通知（单向转发，Discord 兼容） ----------
# 说明：需要 features.webhook-events 与 webhook.enabled 同时为 true 才会投递；
#       投递走独立队列 + 限速线程，不受 features.audit 影响（审计日志关掉也能收到通知）。
webhook:
  enabled: false                # Webhook 总开关（与 features.webhook-events 同时满足才投递）
  url: ""                       # Discord Webhook 地址，留空则静默跳过（不发任何请求）
  username: "Lengbanlist"       # 消息显示的用户名
  avatar-url: ""                # 消息头像图片地址，留空用 Discord 默认头像
  event-types: []               # 只推送这些动作，留空 = 全部。可用动作：封禁/封禁IP/设置封禁时间/解封/解封IP/禁言/修改禁言/解除禁言/警告/取消警告/踢出/冻结玩家/解除冻结/解冻全部玩家/提交举报/受理举报/已读举报/关闭举报/开启隐身/关闭隐身/开启广播/关闭广播
  mention-role: ""              # 仅封禁类动作（封禁/封禁IP/设置封禁时间）@ 一次的身份组 ID，填纯数字或 <@&ID>，留空则不 @
  queue-size: 500               # 待投递队列容量，超出时丢弃最旧的一条（避免回滚/批量封禁打爆内存）
  min-interval-ms: 450          # 两次请求的最小间隔（毫秒），Discord 限制约 5 次/2 秒，不要低于 400
  max-retries: 3                # 429/5xx 的最大重试次数，优先按 Retry-After 响应头退避，读不到则指数退避（1s/2s/4s…）

# ---------- VPN/代理检测 ----------
vpn-detection:
  action: "warn"              # 检测到 VPN 的处理方式: warn(仅通知)/kick(踢出)/ban(封禁IP)
  ban-duration: "7d"          # 自动封禁时长（ban 模式）
  ban-reason: "使用代理/VPN登录"  # 自动封禁原因
  kick-message: "请关闭代理或VPN后重新加入游戏"  # 踢出提示

# ---------- Web 管理面板 ----------
web:
  enabled: false                # 是否启用 Web 管理面板
  host: "127.0.0.1"             # 监听地址（127.0.0.1 仅本机，0.0.0.0 允许远程）
  port: 8080                    # 监听端口
  jwt-secret: "change-this-to-a-random-secret-key"  # JWT 密钥（请改为随机字符串）
  admin-username: "admin"       # 管理员用户名
  admin-password: "lban123"     # 管理员密码
  operator-weight: 2147483647   # 操作者权重（免疫比较，默认最高）
  allowed-origins: []
  theme:                        # 面板主题（面板"设置"页操作,通常无需手改）
    background-type: default    # 背景类型: default(必应壁纸) / url / upload
    background-url: ""          # background-type=url 时的图片地址
    background-file: ""         # background-type=upload 时的已上传文件名
    hidden-buttons: []          # 从面板隐藏的功能页签: ban/mute/report/audit/player/history/ip/alts/broadcast/unban/unmute/warn
  background:                   # 「默认」背景（必应每日壁纸）由服务端下载缓存到 web-assets/background/，浏览器不直连外网
    bing-enabled: true          # 关闭后默认背景只显示渐变，插件不再访问任何外部接口
    bing-market: "zh-CN"        # 必应地区，影响壁纸内容，例如 en-US / ja-JP

# ---------- 封禁时长自动升级（escalation） ----------
# 惯犯封禁时封禁时长逐级递增
escalation:
  tiers:
    - 7d
    - 30d
    - 90d
    - 180d
    - 365d

# ---------- 封禁到期提醒（expiry-reminder） ----------
expiry-reminder:
  lead-time: 600      # 到期前多少秒提醒
  interval: 60        # 扫描间隔（秒）

# ---------- 权重系统（immunity） ----------
# 目标玩家权重高于操作者权重时，可免疫该操作者的封禁/踢出
immunity:
  default-weight: 0   # 玩家默认免疫权重

# ---------- 离线警告（offline-warn） ----------
offline-warn:
  notify-on-join: true  # 玩家上线时通知其离线期间的警告

# ---------- 小号检测（alts） ----------
alts:
  max-scan: 5        # 单次最多展示关联账号数

# ---------- 云端角色模型（models-cloud） ----------
# 角色风格模型从 Lengbanlist-Models 仓库拉取(默认镜像链可换源)
models-cloud:
  enabled: true
  repo: "Serendisand/Lengbanlist-Models"
  branch: "main"
  mirrors: []          # 自定义镜像列表(完整 index.json URL);留空用默认链
  stats:               # 安装统计上报(用于月度精选自动评选)
    enabled: true      # 关闭后仅本地统计,不参与跨服自动评选
    url: "https://lengbanlist-stats.sanno.workers.dev/"            # 统计聚合端点(作者托管,POST {server,model,version});留空=不上报
